const MAH={"altay-mahallesi": "Altay", "ata-mahallesi": "Ata", "cumhuriyet-mahallesi": "Cumhuriyet", "devlet-mahallesi": "Devlet", "eryaman-mahallesi": "Eryaman", "goksu-mahallesi": "Göksu", "guzelkent-mahallesi": "Güzelkent", "seker-mahallesi": "Şeker", "seyh-samil-mahallesi": "Şeyh Şamil", "sehit-osman-avci-mahallesi": "Şehit Osman Avcı", "susuz-mahallesi": "Susuz", "tunahan-mahallesi": "Tunahan", "yavuz-selim-mahallesi": "Yavuz Selim", "yesilova-mahallesi": "Yeşilova"};
const KUYRUK="evinizi satmak veya kiraya vermek istiyorsanız, ihtiyacınız olan tek şey siteyi blok blok bilen bir emlakçı. Süreci sizin adınıza yürütüyoruz, aynı gün dönüş alırsınız.";
const liste=document.getElementById("liste");
function ciz(){
  const q=document.getElementById("ara").value.trim().toLocaleLowerCase("tr");
  const s=document.getElementById("suz").value;
  const secim=VERI.filter(v=>{
    if(s==="yeni"&&v.k)return false;
    if(s==="kiyas"&&!v.k)return false;
    return !q||v.a.toLocaleLowerCase("tr").includes(q);
  });
  if(!secim.length){liste.innerHTML='<p class="yok">Eşleşen kayıt yok.</p>';return;}
  const gruplar={};
  for(const v of secim){(gruplar[v.m]??=[]).push(v);}
  let h="";
  for(const m of Object.keys(gruplar).sort((a,b)=>(MAH[a]||a).localeCompare(MAH[b]||b,"tr"))){
    h+='<h2 class="mah">'+(MAH[m]||m)+" Mahallesi · "+gruplar[m].length+"</h2>";
    for(const v of gruplar[m]){
      h+='<div class="satir'+(v.k?" kiyas":"")+'">'+
         '<span class="rozet '+(v.k?"r-kiyas":"r-yeni")+'">'+(v.k?"kıyas — değişmiyor":"yeni cümle")+'</span>'+
         '<p class="c"><span class="vurgu">'+v.b+'</span> '+KUYRUK+'</p></div>';
    }
  }
  liste.innerHTML=h;
}
document.getElementById("ara").addEventListener("input",ciz);
document.getElementById("suz").addEventListener("change",ciz);
ciz();
